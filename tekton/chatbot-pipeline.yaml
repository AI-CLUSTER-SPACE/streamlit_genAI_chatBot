
# ==========================================
# TASK 1: CLONE SOURCE CODE FROM GITHUB
# ==========================================

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: speedrockets19-dev

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string
      default: main

  workspaces:
    - name: source

  steps:
    - name: clone
      image: alpine/git:2.45.2
      script: |
        #!/bin/sh
        set -eu

        echo "Cloning GitHub repository..."

        git clone \
          --depth 1 \
          --branch "$(params.revision)" \
          "$(params.repo-url)" \
          "$(workspaces.source.path)"

        echo "Source code cloned successfully"


---
# ==========================================
# TASK 2: BUILD AND PUSH DOCKER IMAGE
# ==========================================

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: build-and-push
  namespace: speedrockets19-dev

spec:
  params:
    - name: image
      type: string

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.39.3

      # This configuration requires permission
      # to use a privileged container.
      securityContext:
        privileged: true

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/sh
        set -eu

        export REGISTRY_AUTH_FILE=/tekton/home/.docker/config.json

        echo "Building chatbot Docker image..."

        buildah bud \
          --storage-driver=vfs \
          --format=docker \
          -t "$(params.image)" \
          .

        echo "Pushing image to Docker Hub..."

        buildah push \
          --storage-driver=vfs \
          "$(params.image)" \
          "docker://$(params.image)"

        echo "Docker image pushed successfully"


---
# ==========================================
# TASK 3: DEPLOY TO OPENSHIFT
# ==========================================

apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-to-openshift
  namespace: speedrockets19-dev

spec:
  params:
    - name: image
      type: string

  workspaces:
    - name: source

  steps:
    - name: deploy
      image: registry.redhat.io/openshift4/ose-cli:latest

      workingDir: $(workspaces.source.path)

      script: |
        #!/bin/bash
        set -eu

        echo "Applying OpenShift manifests..."

        oc apply -f openshift/

        echo "Updating chatbot Deployment image..."

        oc set image deployment/speedy-chatbot \
          speedy-chatbot="$(params.image)" \
          -n speedrockets19-dev

        echo "Waiting for rollout..."

        oc rollout status deployment/speedy-chatbot \
          -n speedrockets19-dev \
          --timeout=180s

        echo "Chatbot deployment completed successfully"


---
# ==========================================
# PIPELINE: CHATBOT CI/CD
# ==========================================

apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: chatbot-ci-cd
  namespace: speedrockets19-dev

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string
      default: main

    - name: image
      type: string

  workspaces:
    - name: shared-workspace

  tasks:

    # TASK 1
    - name: clone-source
      taskRef:
        name: git-clone

      params:
        - name: repo-url
          value: $(params.repo-url)

        - name: revision
          value: $(params.revision)

      workspaces:
        - name: source
          workspace: shared-workspace

    # TASK 2
    - name: build-and-push-image
      runAfter:
        - clone-source

      taskRef:
        name: build-and-push

      params:
        - name: image
          value: $(params.image)

      workspaces:
        - name: source
          workspace: shared-workspace

    # TASK 3
    - name: deploy-application
      runAfter:
        - build-and-push-image

      taskRef:
        name: deploy-to-openshift

      params:
        - name: image
          value: $(params.image)

      workspaces:
        - name: source
          workspace: shared-workspace
